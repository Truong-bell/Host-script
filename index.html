<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Devils Will Rise – Script Host</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>🔥 Devils Will Rise</h1>
            <p class="sub">The Strongest Battleground – Script Host</p>
            <p class="credit">Owner: <span>@UnknownGuy9876</span> | Channel: <span>@SGCodexs</span></p>
        </header>

        <div class="info-bar">
            <span class="badge online">✔ Online</span>
            <span class="badge">📦 v2.0</span>
            <span class="badge">🛡️ Delta X / Synapse / Krnl / Script-Ware</span>
        </div>

        <div class="script-box">
            <div class="script-header">
                <span>📜 Paste script của mày vào đây</span>
                <button id="saveBtn">💾 Lưu &amp; Tạo Link Raw</button>
            </div>
            <textarea id="scriptInput" placeholder="Paste toàn bộ script Lua vào đây..."></textarea>
        </div>

        <div class="raw-section" id="rawSection">
            <label>🔗 Link raw của script:</label>
            <div class="raw-link">
                <input type="text" id="rawLink" readonly />
                <button id="copyRawBtn">📋 Copy</button>
            </div>
            <p style="margin-top: 10px; font-size: 13px; color: #888;">
                ⚡ Dùng lệnh: <code id="loadstringExample">loadstring(game:HttpGet("link"))()</code>
            </p>
        </div>

        <div class="footer">
            <p>© 2026 Devils Will Rise – Made with ☠️ by @SGCodexs</p>
        </div>
    </div>

    <script>
        const scriptInput = document.getElementById('scriptInput');
        const saveBtn = document.getElementById('saveBtn');
        const rawSection = document.getElementById('rawSection');
        const rawLink = document.getElementById('rawLink');
        const copyRawBtn = document.getElementById('copyRawBtn');
        const loadstringExample = document.getElementById('loadstringExample');

        function encodeScript(script) {
            return btoa(unescape(encodeURIComponent(script)));
        }

        function decodeScript(encoded) {
            try {
                return decodeURIComponent(escape(atob(encoded)));
            } catch (e) {
                return null;
            }
        }

        function saveScriptToURL(script) {
            const encoded = encodeScript(script);
            const url = window.location.origin + window.location.pathname + '#' + encoded;
            history.pushState({}, '', url);
            return url;
        }

        function loadScriptFromURL() {
            const hash = window.location.hash.slice(1);
            if (hash) {
                const decoded = decodeScript(hash);
                if (decoded) {
                    scriptInput.value = decoded;
                    showRawLink();
                }
            }
        }

        function showRawLink() {
            const url = window.location.href;
            rawLink.value = url;
            loadstringExample.textContent = `loadstring(game:HttpGet("${url}"))()`;
            rawSection.classList.add('active');
        }

        saveBtn.addEventListener('click', function() {
            const script = scriptInput.value;
            if (script.trim() === '') {
                alert('❗ Chưa có script nào được nhập.');
                return;
            }
            const url = saveScriptToURL(script);
            showRawLink();
        });

        copyRawBtn.addEventListener('click', function() {
            rawLink.select();
            navigator.clipboard.writeText(rawLink.value).then(() => {
                copyRawBtn.textContent = '✅ Copied!';
                setTimeout(() => copyRawBtn.textContent = '📋 Copy', 2000);
            });
        });

        loadScriptFromURL();
        window.addEventListener('hashchange', loadScriptFromURL);
    </script>
</body>
                </html>
